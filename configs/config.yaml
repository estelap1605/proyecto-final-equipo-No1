
project:
  name: istanbul-time-series-forecast
  timezone: Europe/Istanbul

data:
  raw_path: data/raw

  initial:
    source: local
    file_path: data/raw/initial_dataset.csv
    url: null
    date_column: date
    target_column: quantity
    format: csv

  weather:
    latitude: 41.0082
    longitude: 28.9784
    timezone: Europe/Istanbul
    temperature_unit: celsius
    wind_speed_unit: kmh
    precipitation_unit: mm

    daily_variables:
      - temperature_2m_mean
      - temperature_2m_max
      - temperature_2m_min
      - precipitation_sum
      - rain_sum
      - snowfall_sum
      - wind_speed_10m_max
      - wind_gusts_10m_max
      - relative_humidity_2m_mean

    hourly_variables:
      - relative_humidity_2m

  holidays:
    country: TR
    language: en

  validation:
    require_unique_dates: true
    require_sorted_dates: true
    min_weather_coverage: 0.95
    min_holiday_coverage: 1.0

  sales:
    input_file: data/source/original_transactions.csv
    output_file: data/raw/initial_dataset.csv
    format: csv

    date_column: invoice_date
    quantity_column: quantity
    price_column: price
    category_column: category
    store_column: shopping_mall
    gender_column: gender
    dayfirst: true
    target_column: quantity

  modeling:
    granularity: weekly
    forecast_horizon_days: 30
    week_start: MON
    output_path: data/processed/modeling_dataset.csv
